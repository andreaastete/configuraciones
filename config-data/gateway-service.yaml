server:
  port: 8080
  
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: vehiculo-service
          uri: lb://vehiculo-service
          predicates:
            - Path=/vehiculo/**
        - id: reporte-service
          uri: lb://reporte-service
          predicates:
            - Path=/reporte/**
        - id: atencion-service
          uri: lb://atencion-service
          predicates:
            - Path=/atencion/**,/reparacion/**,/bono/**
        - id: catalogo-service
          uri: lb://catalogo-service
          predicates:
            - Path=/catalogo/**